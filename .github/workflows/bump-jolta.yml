name: Bump jolta formula

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump to latest jolta release
        run: |
          set -eu
          latest=$(curl -s https://api.github.com/repos/OneAppPlatform/jolta/releases/latest | jq -r .tag_name)
          [ -n "$latest" ] && [ "$latest" != "null" ] || { echo "no release found"; exit 0; }
          current=v$(sed -nE 's|.*/archive/refs/tags/v([0-9.]+)\.tar\.gz.*|\1|p' Formula/jolta.rb)
          echo "formula: $current, latest release: $latest"
          [ "$latest" != "$current" ] || { echo "up to date"; exit 0; }
          curl -sL "https://github.com/OneAppPlatform/jolta/archive/refs/tags/${latest}.tar.gz" -o /tmp/src.tar.gz
          sha=$(sha256sum /tmp/src.tar.gz | cut -d' ' -f1)
          sed -i -E "s|/archive/refs/tags/v[0-9.]+\.tar\.gz|/archive/refs/tags/${latest}.tar.gz|" Formula/jolta.rb
          sed -i -E "s|sha256 \"[a-f0-9]{64}\"|sha256 \"${sha}\"|" Formula/jolta.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "jolta ${latest}"
          git push
